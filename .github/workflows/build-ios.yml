name: Build Swiftfin iOS (Chromecast)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode setup
        run: |
          # Do NOT override xcode-select — use whatever the runner pre-configured.
          # The runner only installs the iOS platform for its default Xcode version;
          # forcing a different Xcode breaks the platform lookup.
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch || true
          echo "=== Xcode in use ==="
          xcodebuild -version
          echo "=== iOS SDKs available ==="
          xcodebuild -showsdks 2>&1 | grep -i iphone
          echo "=== Platforms directory ==="
          ls "$(xcode-select -p)/Platforms/"

      - name: Install Carthage
        run: brew install carthage

      - name: Cache Carthage builds
        uses: actions/cache@v4
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-

      - name: Bootstrap Carthage (GoogleCast + VLC)
        run: |
          carthage bootstrap \
            --use-xcframeworks \
            --platform iOS \
            --cache-builds

      - name: Trust Swift macros (required for headless CI in Xcode 15.3+)
        run: |
          # Xcode 15.3+ requires interactive approval of Swift macros from SPM packages.
          # In CI there is no GUI, so we disable fingerprint validation via user defaults.
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$RUNNER_TEMP/build"

      - name: Package as IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "*.app" ! -name "*.xctest" | head -1)
          echo "App encontrada en: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Swiftfin-Chromecast.ipa Payload/
          echo "IPA creado ✅"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-Chromecast-${{ github.run_number }}
          path: ${{ runner.temp }}/Swiftfin-Chromecast.ipa
          retention-days: 14
