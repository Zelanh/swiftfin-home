name: Build Swiftfin iOS (Chromecast)
# trigger build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode setup
        run: |
          # Match upstream Swiftfin's ci.yml — they use Xcode 26.3 successfully.
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
            echo "Switched to Xcode 26.3"
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          fi
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version

      - name: Trust Swift macros & plugins
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Setup Ruby (for Fastlane — exactly like upstream ci.yml)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies (carthage + tools, via project's Brewfile)
        run: brew bundle --file Brewfile

      - name: Cache Carthage builds
        uses: actions/cache@v4
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-

      - name: Update Carthage (same as upstream ci.yml)
        run: carthage update --use-xcframeworks --cache-builds

      - name: Verify Carthage output (diagnostic — cheap, helps if GoogleCast still fails)
        run: |
          echo "=== Carthage/Build contents ==="
          ls -la Carthage/Build/ || echo "No Carthage/Build directory"
          echo ""
          echo "=== Looking for GoogleCast specifically ==="
          find Carthage -maxdepth 3 -iname "*googlecast*" -o -iname "*chromecast*" 2>/dev/null || true

      - name: Resolve SPM packages (so we can patch Nuke before build)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin

      - name: Patch Nuke for isolated deinit compatibility
        run: |
          NUKE_DIR=$(find ~/Library/Developer/Xcode/DerivedData -path "*SourcePackages/checkouts/Nuke" -type d | head -1)
          echo "Found Nuke at: $NUKE_DIR"
          if [ -z "$NUKE_DIR" ]; then
            echo "❌ Nuke checkout not found"; exit 1
          fi
          find "$NUKE_DIR" -name "*.swift" -exec sed -i '' 's/nonisolated deinit/deinit/g' {} \;
          find "$NUKE_DIR" -name "*.swift" -exec sed -i '' 's/isolated deinit/deinit/g' {} \;
          grep -rn "isolated deinit" "$NUKE_DIR" && echo "⚠️" || echo "✅ Nuke patch clean"

      - name: Ensure FastlaneRunner is executable
        run: chmod +x fastlane/FastlaneRunner

      - name: Build with Fastlane (identical invocation to upstream Swiftfin's ci.yml)
        env:
          # Fastlane's default 3-second base timeout for `xcodebuild -showBuildSettings`
          # is too aggressive for CI runners under load — they sometimes need 30+
          # seconds just to parse a large pbxproj. Bumping base to 60s gives plenty
          # of headroom (Fastlane doubles each retry: 60 → 120 → 240 → 480s = 15min total).
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '60'
        run: |
          # This is the EXACT same command upstream uses (and we've verified it
          # passes on their CI with the same package versions). Fastlane internally
          # invokes xcodebuild with whatever default flags make the SPM build graph
          # correctly produce CasePaths.swiftmodule for iOS (which our direct
          # xcodebuild invocations were failing to do).
          bundle exec fastlane buildLane \
            scheme:"\"Swiftfin\"" \
            xcodeVersion:26.3

      - name: Package as IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" ! -name "*.xctest" | head -1)
          # Fallback: simulator or other config
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" ! -name "*.xctest" -type d | head -1)
          fi
          echo "App encontrada en: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found. Listing all .app files under DerivedData:"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Swiftfin-Chromecast.ipa Payload/
          echo "IPA creado ✅"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-Chromecast-${{ github.run_number }}
          path: ${{ runner.temp }}/Swiftfin-Chromecast.ipa
          retention-days: 14
