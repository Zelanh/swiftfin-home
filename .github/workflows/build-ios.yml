name: Build Swiftfin iOS (Chromecast)
# trigger build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode setup
        run: |
          # Prefer Xcode 26.3 — it correctly resolves SPM packages that mix
          # library + macro plugin products (e.g. swift-case-paths → CasePaths).
          # Xcode 16.4 has a known bug where CasePaths.swiftmodule is not placed
          # in a path that dependent packages can find, causing "no such module".
          # Xcode 26.3 is what the upstream Swiftfin ci.yml already uses.
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
            echo "Switched to Xcode 26.3"
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
            echo "Switched to Xcode 26.0"
          else
            echo "Xcode 26.x not found — using runner default"
          fi
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch || true
          echo "=== Xcode in use ==="
          xcodebuild -version
          echo "=== iOS SDKs available ==="
          xcodebuild -showsdks 2>&1 | grep -i iphone
          echo "=== Xcode installations found ==="
          ls /Applications/ | grep -i xcode || true

      - name: Trust Swift macros (required for headless CI in Xcode 15.3+)
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Install build tools
        run: |
          # swiftgen generates Swift code from assets/strings (required for compilation)
          # swiftformat and swiftlint are called by Xcode build phases; emit "error:" if missing
          brew install swiftgen swiftformat swiftlint || true

      - name: Install Carthage
        run: brew install carthage

      - name: Cache Carthage builds
        uses: actions/cache@v4
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-

      - name: Bootstrap Carthage (GoogleCast + VLC)
        run: |
          carthage bootstrap \
            --use-xcframeworks \
            --platform iOS \
            --cache-builds

      - name: Resolve SPM packages
        run: |
          # Resolve into a fixed derived-data path so we can patch packages before compiling.
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -derivedDataPath "$RUNNER_TEMP/derived_data"

      - name: Patch Nuke for isolated deinit compatibility
        run: |
          NUKE_DIR="$RUNNER_TEMP/derived_data/SourcePackages/checkouts/Nuke"
          echo "=== Nuke source dir ==="
          ls "$NUKE_DIR/Sources/Nuke/Pipeline/" || echo "Nuke dir not found at expected path"

          # Nuke 13.0.2 uses 'nonisolated deinit'. In Swift 5 language mode this
          # is rejected by both Xcode 16.4 and 26.x compilers. Replacing with plain
          # 'deinit' is semantically equivalent in Swift 5.
          # Step 1 MUST run first to avoid 'nonisolated' being partially matched.
          find "$NUKE_DIR" -name "*.swift" \
            -exec sed -i '' 's/nonisolated deinit/deinit/g' {} \;
          find "$NUKE_DIR" -name "*.swift" \
            -exec sed -i '' 's/isolated deinit/deinit/g' {} \;

          echo "=== Verifying patch ==="
          grep -rn "isolated deinit" "$NUKE_DIR" \
            && echo "⚠️  isolated deinit still present — check pattern" \
            || echo "✅ Patch clean — no isolated deinit remaining"

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived_data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package as IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/derived_data/Build/Products" -name "*.app" ! -name "*.xctest" | head -1)
          echo "App encontrada en: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Swiftfin-Chromecast.ipa Payload/
          echo "IPA creado ✅"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-Chromecast-${{ github.run_number }}
          path: ${{ runner.temp }}/Swiftfin-Chromecast.ipa
          retention-days: 14
